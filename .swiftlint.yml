included:
  - App
  - Sources
  - Tests

excluded:
  - .build
  - build
  - DerivedData
  - Website

# Rules beyond the defaults. Chosen because they catch the mistakes this
# codebase is specifically prone to — see CLAUDE.md §9.
opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - first_where
  - force_unwrapping          # a crash in a menu-bar app takes the island with it
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - overridden_super_call
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

disabled_rules:
  - todo                      # TODOs are allowed; untracked ones are not

line_length:
  warning: 100
  error: 120
  ignores_comments: false     # comments wrap too; see the 80-col house style
  ignores_urls: true

identifier_name:
  # Swift argument labels are legitimately short — `.animate(to:)` reads
  # better than `.animate(presentation:)`, and `id` is the Identifiable
  # spelling. Length limits still apply to everything else.
  excluded:
    - id
    - to
    - in
    - at
    - x
    - y

type_name:
  allowed_symbols: ["_"]

function_body_length:
  warning: 45
  error: 50

type_body_length:
  warning: 250
  error: 350

file_length:
  warning: 400
  error: 500
  ignore_comment_only_lines: true

cyclomatic_complexity:
  warning: 8
  error: 10
  # A pure dispatch switch over N events has complexity N by this metric, but
  # no branching logic — each case delegates to one handler. Count the
  # handlers, not the cases.
  ignores_case_statements: true

nesting:
  type_level: 2

custom_rules:
  no_appkit_in_core:
    include: ".*/Sources/PerchCore/.*\\.swift"
    name: "PerchCore must stay UI-free"
    regex: "^\\s*import\\s+(SwiftUI|AppKit|Cocoa)\\b"
    message: "PerchCore must never import SwiftUI or AppKit — CLAUDE.md §3."
    severity: error

  no_ai_attribution:
    name: "No tool attribution"
    regex: "(?i)(co-authored-by:.*(claude|copilot|chatgpt|gpt-|gemini|cursor)|generated with \\[?(claude|chatgpt|copilot))"
    message: "Commits and code credit people, not tools — CONTRIBUTING.md."
    severity: error

  no_fixed_animation_duration:
    include: ".*/Sources/PerchModules/.*\\.swift"
    name: "Use the shared motion tokens"
    regex: "\\.(easeInOut|easeIn|easeOut|linear)\\(duration:"
    message: "Animate with IslandMotion tokens, not a fixed duration — CLAUDE.md §9."
    severity: error
