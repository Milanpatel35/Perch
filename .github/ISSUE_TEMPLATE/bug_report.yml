name: Bug report
description: Something is broken
labels: ["bug", "needs triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Perch version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.4, 14-inch MacBook Pro M3"
    validations:
      required: true
  - type: dropdown
    id: displays
    attributes:
      label: Display setup
      options:
        - Built-in only
        - Built-in plus one external
        - Built-in plus two or more externals
        - Lid closed, external only
        - Mirrored
        - Desktop Mac, external only
    validations:
      required: true
  - type: textarea
    id: modules
    attributes:
      label: Which modules are enabled
  - type: textarea
    id: media
    attributes:
      label: Screenshot or recording
      description: Drag files in here. Very helpful for layout and animation bugs.
