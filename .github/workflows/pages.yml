name: Pages

# Deploys the marketing site and regenerates the Sparkle appcast.
# Runs on every push to main, and after a release publishes its .dmg.

on:
  push:
    branches: [main]
    paths: ["Website/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Always `main`, whatever fired the run.
      #
      # A `release: published` run is checked out at the *tag*, and a tag's
      # tree is by definition no newer than main — so any fix that landed
      # after the tag was cut gets silently rolled back by publishing the
      # release. That is not hypothetical: it happened in production on
      # 21 September 2026, reverting the site's download link to the
      # previous version minutes after the new one went out.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build site
        run: |
          cd Website
          node build.js || echo "no build step yet — publishing static files"
      - name: Generate appcast from releases
        run: Scripts/appcast.sh Website/appcast.xml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Website
      - id: deploy
        uses: actions/deploy-pages@v4
