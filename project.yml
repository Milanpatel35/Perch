name: Perch

options:
  bundleIdPrefix: app.perch
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: "$(ARCHS_STANDARD)"        # arm64 + x86_64, universal
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    # Debug builds only the machine you are sitting at. Release is the
    # universal binary that ships — building both slices on every incremental
    # compile costs a minute a time and buys nothing until archive.
    debug:
      ONLY_ACTIVE_ARCH: YES
    release:
      ONLY_ACTIVE_ARCH: NO

packages:
  # The allowed list, and only this list. New entries need an issue first —
  # see CLAUDE.md §9.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    from: 9.0.0

targets:

  # ---------------------------------------------------------------- app ---
  Perch:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources
        buildPhase: resources
        # The plist and the entitlements are build inputs, not resources.
        # Copying them into the bundle as well produces a duplicate-file
        # error at best and a second, stale Info.plist at worst.
        excludes:
          - Info.plist
          - Perch.entitlements
    dependencies:
      - target: PerchUI
      - target: PerchCore
      - package: Sparkle
      - package: KeyboardShortcuts
      - package: Defaults
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.perch.Perch
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Perch.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # --------------------------------------------------------------- core ---
  # Pure logic. Must never import SwiftUI or AppKit — CLAUDE.md §3.
  # That rule is enforced by test TC-ARC-001, not by convention.
  PerchCore:
    type: framework
    platform: macOS
    sources:
      - Sources/PerchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.perch.PerchCore
        # A macOS framework is a bundle, and a bundle without an Info.plist
        # cannot be code-signed. Xcode synthesises one from these.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT licensed. Free forever."

  # ----------------------------------------------------------------- ui ---
  PerchUI:
    type: framework
    platform: macOS
    sources:
      - Sources/PerchUI
      - Sources/PerchModules
    dependencies:
      - target: PerchCore
      - package: Defaults
      # Modules register their own global shortcuts — the clipboard picker is
      # the first — so the library belongs here, not only in the app target.
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.perch.PerchUI
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT licensed. Free forever."

  # -------------------------------------------------------------- tests ---
  PerchCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PerchCoreTests
      - Tests/Fixtures
    dependencies:
      - target: PerchCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  PerchUITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PerchUITests
    dependencies:
      - target: PerchUI
      - target: PerchCore
      # Module tests set and reset preferences, so the test bundle links the
      # same defaults library the modules do.
      - package: Defaults
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Perch:
    build:
      targets:
        Perch: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PerchCoreTests
        - PerchUITests
    archive:
      config: Release
